services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-insecure-secret-change-me}
      DJANGO_DEBUG: "false"
      DATA_DIR: /data
      PORT: "8000"
      # --- Calls (LiveKit SFU) ---
      # URL the BROWSER connects to. For remote hosts set this to your public
      # address, e.g. wss://livekit.example.com
      LIVEKIT_WS_URL: ${LIVEKIT_WS_URL:-ws://localhost:7880}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-devsecret-change-me-at-least-32-bytes-long}
      # Advertise coturn to clients (JSON). Uncomment when running --profile turn:
      # EXTRA_ICE_SERVERS: '[{"urls":"turn:localhost:3478","username":"slack","credential":"slackturnpassword"}]'
      # Uncomment to use Postgres (and enable the `postgres` profile below):
      # DATABASE_URL: postgres://slack:slack@postgres:5432/slack
      # Uncomment to use Redis for the channel layer (multi-process scaling):
      # REDIS_URL: redis://redis:6379/0
    volumes:
      - ./data:/data
    restart: unless-stopped

  # --- LiveKit SFU: powers group video calls + screen sharing ---
  livekit:
    image: livekit/livekit-server:latest
    command: --config /etc/livekit.yaml
    ports:
      - "7880:7880"            # signaling (WebSocket)
      - "7881:7881"            # RTC over TCP fallback
      - "50000-50100:50000-50100/udp"  # RTC media
    volumes:
      - ./infra/livekit.yaml:/etc/livekit.yaml:ro
    restart: unless-stopped

  # --- Optional Postgres (enable with: docker compose --profile postgres up) ---
  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: slack
      POSTGRES_PASSWORD: slack
      POSTGRES_DB: slack
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  # --- Optional Redis channel layer (enable with: --profile redis) ---
  redis:
    image: redis:7-alpine
    profiles: ["redis"]
    restart: unless-stopped

  # --- Optional coturn TURN server for strict NAT/firewall traversal ---
  # Enable with: docker compose --profile turn up
  # (and uncomment EXTRA_ICE_SERVERS on the app service).
  coturn:
    image: coturn/coturn:latest
    profiles: ["turn"]
    network_mode: host
    volumes:
      - ./infra/turnserver.conf:/etc/coturn/turnserver.conf:ro
    restart: unless-stopped

volumes:
  pgdata:
