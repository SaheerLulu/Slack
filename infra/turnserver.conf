# coturn TURN server config — relays media for clients behind strict NATs/
# firewalls when a direct connection to the SFU can't be established.
#
# Enable with the "turn" compose profile, and point the app at it by setting
# EXTRA_ICE_SERVERS (see .env.example). Replace the realm/host and the
# user credential below for production, and open UDP 3478 + the relay range.

listening-port=3478
fingerprint
lt-cred-mech

# Static long-term credential advertised to clients via EXTRA_ICE_SERVERS.
# CHANGE THIS in production.
user=slack:slackturnpassword
realm=slack

# Relay port range (publish these on the host).
min-port=49152
max-port=49200

# Quieten logs a little.
no-cli
no-tlsv1
no-tlsv1_1

# For a public deployment, set your server's public IP so relayed
# candidates are reachable:
# external-ip=203.0.113.10
